name: Renovar certificado SSL (DuckDNS)

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Renovar aunque el certificado actual siga vigente'
        type: boolean
        default: true

env:
  DOMINIO: wnss.duckdns.org
  PUERTO: '23516'

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Certbot y el plugin de DuckDNS
        run: |
          pip install certbot certbot-dns-duckdns --break-system-packages

      - name: Crear credenciales de DuckDNS
        run: |
          echo "dns_duckdns_token=${{ secrets.DUCKDNS_TOKEN }}" > duckdns.ini
          chmod 600 duckdns.ini

      - name: Comprobar si el certificado actual sigue vigente
        id: check
        run: |
          if [ "${{ github.event.inputs.forzar }}" = "true" ]; then
            echo "Renovacion forzada manualmente."
            echo "renovar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CERT=$(echo | openssl s_client -connect ${DOMINIO}:${PUERTO} -servername ${DOMINIO} 2>/dev/null | openssl x509 2>/dev/null)
          if [ -z "$CERT" ]; then
            echo "No se pudo comprobar el certificado actual, renovamos por si acaso."
            echo "renovar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Si el certificado servido no es de este dominio, hay que renovar siempre
          if ! echo "$CERT" | openssl x509 -noout -ext subjectAltName 2>/dev/null | grep -q "DNS:${DOMINIO}"; then
            echo "El certificado servido no es de ${DOMINIO}, renovamos."
            echo "renovar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          EXPIRY=$(echo "$CERT" | openssl x509 -noout -enddate | cut -d= -f2)
          EXPIRY_TS=$(date -d "$EXPIRY" +%s)
          NOW_TS=$(date +%s)
          DIAS_RESTANTES=$(( (EXPIRY_TS - NOW_TS) / 86400 ))
          echo "Dias restantes hasta que caduque: $DIAS_RESTANTES"
          if [ "$DIAS_RESTANTES" -le 20 ]; then
            echo "renovar=true" >> "$GITHUB_OUTPUT"
          else
            echo "renovar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generar certificado
        if: steps.check.outputs.renovar == 'true'
        run: |
          certbot certonly \
            --config-dir ./letsencrypt \
            --work-dir ./letsencrypt-work \
            --logs-dir ./letsencrypt-logs \
            --authenticator dns-duckdns \
            --dns-duckdns-credentials duckdns.ini \
            --dns-duckdns-propagation-seconds 60 \
            -d ${DOMINIO} \
            --non-interactive --agree-tos \
            -m wantednetworks@gmail.com

      - name: Enviar los certificados a Discord
        if: steps.check.outputs.renovar == 'true'
        run: |
          CERT_DIR="./letsencrypt/live/${DOMINIO}"
          curl -F "payload_json={\"content\":\"🔐 **Certificado SSL renovado** para \`${DOMINIO}\`.\\n\\nDescarga los 2 archivos adjuntos y subelos a la carpeta \`certs/\` en Wispbyte, reemplazando los antiguos. No hace falta reiniciar el bot: los recarga solo en menos de un minuto.\"}" \
            -F "fullchain.pem=@${CERT_DIR}/fullchain.pem" \
            -F "privkey.pem=@${CERT_DIR}/privkey.pem" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Aviso si algo fallo
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\":\"⚠️ **Fallo al renovar el certificado SSL** de ${DOMINIO}. Revisa los logs del workflow en GitHub Actions.\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
